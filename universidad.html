        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700&display=swap"

    <style>
        :root {
            --primary-purple: #9d00ff;
            --secondary-purple: #6a00f4;
            --dark-bg: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --text-white: #ffffff;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        .nav-link {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }

        /* --- Fondo Animado --- */
        .bg-gradient-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a0033 0%, #050505 100%);
            z-index: -1;
        }

        .neon-circle {
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--primary-purple);
            filter: blur(180px);
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
        }

        /* --- Navbar --- */
        .navbar {
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(157, 0, 255, 0.2);
        }

        .nav-link {
            color: var(--text-white) !important;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .nav-link:hover {
            color: var(--primary-purple) !important;
            text-shadow: 0 0 10px var(--primary-purple);
        }

        /* --- Hero Section --- */
        .hero-section {
            height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
        }

        .glitch-title {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            background: linear-gradient(to right, #fff, var(--primary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .btn-futuristic {
            border: 1px solid var(--primary-purple);
            color: var(--text-white);
            background: transparent;
            padding: 12px 30px;
            border-radius: 0;
            position: relative;
            overflow: hidden;
            transition: 0.4s;
            text-transform: uppercase;
            font-family: 'Orbitron';
            font-size: 0.8rem;
        }

        .btn-futuristic:hover {
            background: var(--primary-purple);
            box-shadow: 0 0 30px var(--primary-purple);
            color: white;
        }

        /* --- Cards Glassmorphism --- */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            transition: 0.4s;
        }

        .glass-card:hover {
            border-color: var(--primary-purple);
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(157, 0, 255, 0.1);
        }

        /* --- Skill Badges --- */
        .skill-badge {
            background: rgba(157, 0, 255, 0.1);
            border: 1px solid var(--primary-purple);
            color: #fff;
            padding: 5px 15px;
            margin: 5px;
            display: inline-block;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        /* --- Footer --- */
        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px 0;
            margin-top: 100px;
        }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--secondary-purple);
            border-radius: 10px;
        }

        .card-img-top {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

</head>
